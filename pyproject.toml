[project]
name = "moe-data"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "dayangac", email = "emreday01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "libigl>=2.6.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pymeshlab>=2025.7.post1",
    "pyyaml>=6.0.3",
    "rtree>=1.4.1",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "thingi10k>=1.5.0",
    "torch>=2.15.0",
    "trimesh>=5.2.1",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]          # independent of the editable .pth (iCloud can mark it hidden; Python then skips it)
timeout = 120
